      - name: Fix stale ndk_platform references
        working-directory: twrp
        run: |
          set -e

          echo "=== SEBELUM: referensi ndk_platform yang tersisa di bootable/recovery ==="
          grep -rn "ndk_platform" bootable/recovery \
            --include=Android.mk --include=Android.bp --include=*.mk || true

          # varian *-ndk_platform sudah dihapus dari AOSP baru, gantinya *-ndk.
          # keystore2 disamakan ke V4, sama dengan yang dipakai patch libtar di atas.
          FILES=$(grep -rl "ndk_platform" bootable/recovery \
            --include=Android.mk --include=Android.bp --include=*.mk || true)

          if [ -z "$FILES" ]; then
            echo "Tidak ada referensi ndk_platform yang perlu diganti."
          else
            echo "$FILES" | xargs sed -i \
              -e 's/android\.system\.keystore2-V1-ndk_platform/android.system.keystore2-V4-ndk/g' \
              -e 's/-ndk_platform/-ndk/g'
          fi

          echo "=== SESUDAH: libtar/Android.mk ==="
          grep -nE "keystore2|apc|ndk|libasync_safe|libsysutils|libboot_control_client" bootable/recovery/libtar/Android.mk || true

          if grep -rq "ndk_platform" bootable/recovery \
               --include=Android.mk --include=Android.bp --include=*.mk; then
            echo "ERROR: masih ada ndk_platform di bootable/recovery."
            exit 1
          fi

          echo "=== versi AIDL keystore2 yang tersedia di tree ==="
          BP=$(grep -rl 'name: "android.system.keystore2"' system \
                 --include=Android.bp 2>/dev/null | head -1 || true)
          if [ -n "$BP" ]; then
            echo "Didefinisikan di: $BP"
            grep -n "version" "$BP" | head -20 || true
          else
            echo "Definisi aidl_interface android.system.keystore2 tidak ditemukan di system/."
          fi

      - name: Find remaining stale references
        working-directory: twrp
